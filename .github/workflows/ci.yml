name: CI

on:
  push:
  pull_request:

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: catches secrets in old commits too
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: shellcheck + zsh -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck is pre-installed on GitHub's Ubuntu runners.
      - name: shellcheck (sh/bash only)
        run: |
          files=$(git ls-files 'install.sh' 'bin/*' | while read -r f; do
            head -1 "$f" | grep -qE '^#!.*(bash|sh)$' && echo "$f"
          done)
          echo "$files"
          [ -n "$files" ] && shellcheck -S warning $files || true
      # shellcheck cannot parse zsh; use zsh's own syntax check.
      - name: zsh -n
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          rc=0
          for f in $(git ls-files 'home/.config/zsh/**/*.zsh' 'home/.config/zsh/.zshrc' 'home/.config/zsh/.zshenv' 'home/.zshenv'); do
            zsh -n "$f" || { echo "FAIL $f"; rc=1; }
          done
          exit $rc

  install-test:
    name: install into a sandboxed HOME
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run installer with a fake HOME
        run: |
          mkdir -p /tmp/fakehome
          HOME=/tmp/fakehome ./install.sh --link-only
          test -L /tmp/fakehome/.zshenv
          test -L /tmp/fakehome/.config/zsh/.zshrc
          echo "linked OK"

  install-test-macos:
    name: install into a sandboxed HOME (macOS, bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # macOS ships bash 3.2.57 and nothing newer. The Ubuntu job runs bash 5, so
      # it cannot catch 3.2-only parser bugs — one of which silently broke the
      # symlink-prune loop (a comment inside `{ }` inside `<( )` was executed as
      # a command). This job is the guard against that class of regression.
      - name: bash version
        run: /bin/bash --version | head -1
      - name: run installer with a fake HOME
        run: |
          mkdir -p /tmp/fakehome
          HOME=/tmp/fakehome ./install.sh --link-only 2>&1 | tee /tmp/out.log
          test -L /tmp/fakehome/.zshenv
          test -L /tmp/fakehome/.config/zsh/.zshrc
          if grep -qiE 'command not found|ambiguous redirect|syntax error' /tmp/out.log; then
            echo "installer emitted shell errors"; exit 1
          fi
          echo "linked OK, no shell errors"

      # The regression test that matters. `zsh -n` and `zsh -i -c` both pass on a
      # config whose prompt hangs — with -c the shell never renders a prompt, so
      # precmd hooks never run. This opens a pty, starts a real interactive login
      # shell and waits for the prompt. --cold clears the p10k cache because the
      # hang only fires on a stat-cache miss.
      - name: interactive shell reaches a prompt
        run: |
          HOME=/tmp/fakehome ./bin/test-shell --cold --timeout 180 --verbose
