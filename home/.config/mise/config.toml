# Global tool versions — mise is the only runtime manager on this machine.
#
# It replaces nvm, asdf, fnm, nodenv, pyenv, rbenv, phpenv and jenv, all of which
# were installed or configured at once and fought over the same PATH entries,
# with the winner decided by shell-fragment load order.
#
# Pinned to major versions rather than "latest": "latest" re-resolves against the
# GitHub API on every shell start, which is both non-reproducible and produced a
# rate-limit warning on every single prompt when unauthenticated.
#
#   mise use -g <tool>@<version>   set a global version
#   mise use <tool>@<version>      pin for this project (writes ./mise.toml)
#   mise ls --current              what is active here, and where it came from
#   mise install                   install everything declared below
#
# NOT managed here: Rust. rustup stays the source of truth, because this machine
# has nine cross-compilation targets installed (Android arm64/armv7/i686/x86_64,
# iOS, x86_64-pc-windows-msvc) plus cargo-xwin. mise's rust plugin does not
# manage rustup targets or components, so migrating would break all of them.

[tools]
node = "24"
python = "3.13"
ruby = "3.2.2"
go = "1.26"
bun = "1"
java = "temurin-21"
ghq = "latest"   # pinned: "latest" re-queries the GitHub API each startup

[settings]
# Read .nvmrc / .node-version / package.json devEngines, like nvm did.
# mise disables idiomatic version files by default; this restores that behaviour.
idiomatic_version_file_enable_tools = ["node"]

# Several mise operations (version lists, python attestation checks, self-update)
# call the GitHub API and fail with 403 when unauthenticated. Raise the limit by
# exporting a token from ~/.config/zsh/secrets.zsh (0600) — never commit one:
#   export MISE_GITHUB_TOKEN="$(gh auth token)"
